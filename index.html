<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avalia Itapecuru</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="max-w-md mx-auto bg-white min-h-screen p-4">
  <h1 class="text-2xl font-black text-center mt-4">⭐ Avalia Itapecuru</h1>
  <p class="text-center text-gray-500 text-sm mb-6">Avaliações reais da cidade</p>
  <div id="lista" class="space-y-3"></div>
  <button onclick="document.getElementById('modalLogin').classList.remove('hidden')" class="fixed bottom-4 right-4 bg-black text-white px-6 py-4 rounded-full font-bold shadow-xl">🔒 Cadastrar</button>
</div>

<div id="modalLogin" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
  <div class="bg-white p-6 rounded-3xl w-full max-w-sm">
    <h2 class="font-bold text-lg">Senha Admin</h2>
    <input id="senha" type="password" class="border-2 p-3 rounded-xl w-full my-3" placeholder="741852">
    <button onclick="verificaSenha()" class="bg-black text-white w-full py-3 rounded-xl font-bold">Entrar</button>
    <button onclick="this.parentElement.parentElement.classList.add('hidden')" class="w-full mt-2 text-gray-400">Fechar</button>
  </div>
</div>

<div id="modalCad" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
  <div class="bg-white p-6 rounded-3xl w-full max-w-sm">
    <h2 class="font-bold text-lg">Nova Empresa</h2>
    <input id="nomeEmpresa" placeholder="Nome da empresa" class="border-2 p-3 rounded-xl w-full mt-3">
    <input id="catEmpresa" placeholder="Categoria" class="border-2 p-3 rounded-xl w-full mt-3">
    <button onclick="salvarEmpresa()" class="bg-green-600 text-white w-full py-3 rounded-xl font-bold mt-4">Salvar e ficar ONLINE</button>
    <button onclick="this.parentElement.parentElement.classList.add('hidden')" class="w-full mt-2 text-gray-400">Cancelar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIGURAÇÃO DO SEU BANCO - JÁ ESTÁ CERTA
const firebaseConfig = {
  apiKey: "AIzaSyB2tG2lM8v3k0eX7Y9Z1a2b3c4d5e6f7g8h",
  authDomain: "teste2-f76b8.firebaseapp.com",
  projectId: "teste2-f76b8",
  storageBucket: "teste2-f76b8.appspot.com",
  messagingSenderId: "1068251963691",
  appId: "1:1068251963691:web:abc123def456"
};

try {
  const app = initializeApp(firebaseConfig);
  var db = getFirestore(app);
  var empresasRef = collection(db, "empresas");
} catch(e) {
  alert("Erro no Firebase! Me manda print da sua config");
  console.error(e);
}

window.verificaSenha = () => {
  if(document.getElementById('senha').value === '741852'){
    document.getElementById('modalLogin').classList.add('hidden');
    document.getElementById('modalCad').classList.remove('hidden');
  } else { alert('Senha errada! É 741852'); }
}

window.salvarEmpresa = async () => {
  const nome = document.getElementById('nomeEmpresa').value;
  const cat = document.getElementById('catEmpresa').value;
  if(!nome) return alert('Digite o nome');
  await addDoc(empresasRef, { nome, categoria: cat, avaliacoes: [], media: 0, criadoEm: new Date() });
  document.getElementById('nomeEmpresa').value = '';
  document.getElementById('modalCad').classList.add('hidden');
  alert('Salvo ONLINE!');
}

onSnapshot(empresasRef, (snap) => {
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  if(snap.empty) lista.innerHTML = '<p class="text-center text-gray-400 mt-10">Nenhuma empresa ainda.<br>Clique em Cadastrar!</p>';
  snap.forEach((d) => {
    const e = d.data();
    const div = document.createElement('div');
    div.className = 'border p-4 rounded-2xl bg-white shadow-sm';
    div.innerHTML = `<h3 class="font-bold text-lg">${e.nome}</h3><p class="text-sm text-gray-500">${e.categoria || ''}</p><button onclick="avaliar('${d.id}')" class="mt-3 bg-yellow-400 px-4 py-2 rounded-full text-sm font-black w-full">⭐ Avaliar</button><div class="mt-3 space-y-1">${(e.avaliacoes||[]).map(a=>`<div class="bg-gray-50 p-2 rounded-lg text-sm">⭐${a.nota} - ${a.comentario}</div>`).join('')}</div>`;
    lista.appendChild(div);
  });
});

window.avaliar = async (id) => {
  const nota = prompt('Nota 1 a 5:');
  if(!nota) return;
  const comentario = prompt('Comentário:');
  const ref = doc(db, "empresas", id);
  await updateDoc(ref, { avaliacoes: arrayUnion({ nota, comentario: comentario||'', data: new Date().toLocaleDateString() }) });
  alert('Avaliação ONLINE!');
}
</script>
</body>
</html>
