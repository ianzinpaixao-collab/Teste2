<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AvaliaMais V1</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f7] font-sans">

<nav class="bg-black text-white p-4 flex justify-between items-center sticky top-0 z-40">
<div onclick="irInicio()" class="font-extrabold text-xl cursor-pointer">avalia<span class="text-blue-500">Mais</span> V1</div>
<div class="flex gap-2">
<button onclick="irInicio()" class="bg-white/20 px-4 py-2 rounded-full text-sm font-bold">Empresas</button>
<button onclick="irRank()" class="bg-yellow-500 text-black px-4 py-2 rounded-full text-sm font-bold">🏆 Rank</button>
<button onclick="abrirAdmin()" class="bg-blue-600 px-4 py-2 rounded-full text-sm font-bold">🔒 Cadastrar</button>
</div>
</nav>

<!-- TELA INICIO / LISTA PUBLICA -->
<div id="tela-inicio" class="max-w-5xl mx-auto p-4">
<h1 class="font-extrabold text-2xl mt-2">Empresas cadastradas</h1>
<div id="lista" class="grid md:grid-cols-3 gap-4 mt-4"></div>
</div>

<!-- TELA RANK -->
<div id="tela-rank" class="hidden max-w-3xl mx-auto p-4">
<h1 class="font-extrabold text-2xl">🏆 Mais bem avaliados</h1>
<div id="lista-rank" class="mt-4 space-y-3"></div>
<button onclick="irInicio()" class="w-full bg-black text-white py-3 rounded-xl mt-6 font-bold">Voltar</button>
</div>

<!-- TELA EMPRESA - ONDE O QR CAI -->
<div id="tela-empresa" class="hidden max-w-2xl mx-auto p-4">
<div class="bg-white rounded-[28px] overflow-hidden shadow">
<div id="e-foto" class="h-80 bg-gray-200 bg-cover bg-center"></div>
<div class="p-6">
<h1 id="e-nome" class="text-3xl font-extrabold"></h1>
<p id="e-cat" class="bg-black text-white inline-block px-3 py-1 rounded-full text-xs mt-2"></p>
<p id="e-cnpj" class="text-xs text-gray-500 mt-2"></p>
<div class="flex gap-3 mt-2 text-sm">
<span id="e-tel" class="bg-gray-100 px-3 py-1 rounded-full"></span>
<span id="e-email" class="bg-gray-100 px-3 py-1 rounded-full"></span>
</div>
<p id="e-desc" class="mt-4 text-gray-600"></p>
<div id="e-fotos" class="grid grid-cols-3 gap-2 mt-4"></div>

<div class="mt-8 border-t pt-6">
<h3 class="font-bold text-lg">Avaliações <span id="e-media" class="bg-yellow-400 px-2 py-1 rounded-full text-sm"></span></h3>
<div id="e-avs" class="mt-3 space-y-2"></div>
<div class="mt-4 bg-gray-50 p-4 rounded-2xl">
<p class="font-bold text-sm">Deixe sua avaliação</p>
<div id="stars" class="flex gap-1 text-3xl mt-1 cursor-pointer">
<span onclick="setStar(1)">☆</span><span onclick="setStar(2)">☆</span><span onclick="setStar(3)">☆</span><span onclick="setStar(4)">☆</span><span onclick="setStar(5)">☆</span>
</div>
<textarea id="e-com" placeholder="Escreva sua experiência..." class="w-full border p-3 rounded-xl mt-2"></textarea>
<button onclick="avaliar()" class="w-full bg-black text-white py-3 rounded-xl font-bold mt-2">Enviar avaliação</button>
</div>
</div>
<button onclick="irInicio()" class="w-full bg-gray-100 py-3 rounded-xl font-bold mt-6">Voltar</button>
</div>
</div>
</div>

<!-- TELA ADMIN - SÓ VOCÊ -->
<div id="tela-admin" class="hidden max-w-xl mx-auto p-4">
<div class="bg-white rounded-[28px] p-6 shadow">
<h2 class="font-extrabold text-xl">Cadastro de empresa - Só Dono</h2>
<input id="c-nome" placeholder="Nome da empresa *"
