<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Cinco - Itapecuru</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f5f5f7;color:#111}
header{background:#0f0f0f;color:#fff;padding:14px 18px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px;margin-right:10px}
.logo span{color:#f7c600}
.btn{border:0;padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer}
.btn-dark{background:#2a2a2a;color:#fff}
.btn-yellow{background:#f7c600;color:#111}
.btn-blue{background:#2b7bff;color:#fff}
main{padding:18px;max-width:950px;margin:auto}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.muted{color:#666;font-size:14px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #ddd;margin-top:6px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
img.thumb{width:100%;height:170px;object-fit:cover;border-radius:12px}
.badge{display:inline-block;background:#f0f0f0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600}
#statusBox{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;border:1px dashed #ccc}
</style>
</head>
<body>
<header>
<div class="logo">Top<span>Cinco</span></div>
<button class="btn btn-dark" onclick="showTab('empresas')">Empresas</button>
<button class="btn btn-yellow" onclick="showTab('rank')">🏆 Ranking</button>
<button class="btn btn-blue" onclick="showTab('cad')">🔒 Cadastrar</button>
</header>
<main>
<div id="tab-empresas">
<div id="statusBox">⏳ Carregando banco online...</div>
<div id="lista"></div>
</div>
<div id="tab-rank" style="display:none"><h2>🏆 Ranking</h2><div id="rankLista"></div></div>
<div id="tab-cad" style="display:none">
<div class="card">
<h3>Cadastrar empresa</h3>
<p class="muted">Senha: 102030</p>
<input id="senha" type="password" placeholder="Senha admin">
<input id="nome" placeholder="Nome da empresa *">
<input id="cnpj" placeholder="CNPJ">
<input id="email" placeholder="E-mail">
<input id="whats" placeholder="WhatsApp">
<select id="cat"><option value="">Categoria *</option><option>Venda de Serviços</option><option>Alimentação</option><option>Saúde</option><option>Beleza</option><option>Educação</option><option>Varejo</option><option>Outros</option></select>
<textarea id="desc" placeholder="Descrição"></textarea>
<input id="fotos" type="file" multiple accept="image/*">
<div id="preview" class="grid"></div>
<button class="btn btn-blue" id="btnSalvar" onclick="salvar()" style="width:100%;margin-top:12px">Salvar empresa</button>
<p id="saveStatus" class="muted"></p>
</div>
</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAxAzMNQkH_MwJtlXPa3BTxi2N9vbm6EkI",
  authDomain: "topfive-73afe.firebaseapp.com",
  projectId: "topfive-73afe",
  storageBucket: "topfive-73afe.firebasestorage.app",
  messagingSenderId: "639921758998",
  appId: "1:639921758998:web:459db23b535279bac76637"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let fotosBase64=[];
function showTab(t){
  document.getElementById('tab-empresas').style.display=t==='empresas'?'block':'none';
  document.getElementById('tab-rank').style.display=t==='rank'?'block':'none';
  document.getElementById('tab-cad').style.display=t==='cad'?'block':'none';
  if(t==='empresas') carregar();
  if(t==='rank') carregarRank();
}
window.showTab=showTab;
function comprimir(file){
  return new Promise((res)=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const max=800; let w=img.width,h=img.height;
        if(w>h){ if(w>max){ h*=max/w; w=max; } } else { if(h>max){ w*=max/h; h=max; } }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        res(canvas.toDataURL('image/jpeg',0.6));
      }; img.src=e.target.result;
    }; r.readAsDataURL(file);
  });
}
document.getElementById('fotos').addEventListener('change', async (e)=>{
  fotosBase64=[]; const preview=document.getElementById('preview');
  preview.innerHTML='Comprimindo...';
  for(const f of e.target.files){ const b64=await comprimir(f); fotosBase64.push(b64); }
  preview.innerHTML=fotosBase64.map(b=>`<img src="${b}" class="thumb">`).join('');
});
async function carregar(){
  const statusBox=document.getElementById('statusBox'); const listaEl=document.getElementById('lista');
  statusBox.textContent='⏳ Conectando no topfive-73afe...'; listaEl.innerHTML='';
  try{
    const snap=await getDocs(collection(db,'empresas'));
    if(snap.empty){ statusBox.textContent='✅ Conectado! Nenhuma empresa ainda. Cadastre a primeira!'; return; }
    statusBox.textContent=`✅ ${snap.size} empresa(s)`;
    const empresas=[]; snap.forEach(d=>empresas.push({id:d.id,...d.data()}));
    empresas.sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
    listaEl.innerHTML=empresas.map(emp=>`
      <div class="card">
        ${emp.fotos && emp.fotos[0]? `<img src="${emp.fotos[0]}" class="thumb" style="margin-bottom:10px">` : ''}
        <h3>${emp.nome}</h3><span class="badge">${emp.cat||'Outros'}</span><p class="muted" style="margin-top:6px">${emp.desc||''}</p>
      </div>`).join('');
  }catch(err){ statusBox.innerHTML=`❌ Erro: ${err.message}`; }
}
async function carregarRank(){
  const rankEl=document.getElementById('rankLista'); rankEl.innerHTML='Carregando...';
  const snap=await getDocs(collection(db,'empresas')); const porCat={};
  snap.forEach(d=>{ const data=d.data(); const cat=data.cat||'Outros'; if(!porCat[cat]) porCat[cat]=[]; porCat[cat].push(data); });
  rankEl.innerHTML=Object.keys(porCat).map(cat=>`<div class="card"><h3>${cat} (${porCat[cat].length})</h3>${porCat[cat].map(e=>`<p>• ${e.nome}</p>`).join('')}</div>`).join('') || 'Nenhuma empresa';
}
window.salvar=async()=>{
  const senha=document.getElementById('senha').value; if(senha!=='102030'){ alert('Senha errada!'); return; }
  const nome=document.getElementById('nome').value.trim(); if(!nome){ alert('Nome obrigatório'); return; }
  const btn=document.getElementById('btnSalvar'); const st=document.getElementById('saveStatus');
  btn.disabled=true; btn.textContent='Salvando...'; st.textContent='Enviando...';
  try{
    await addDoc(collection(db,'empresas'),{nome,cnpj:document.getElementById('cnpj').value,email:document.getElementById('email').value,whats:document.getElementById('whats').value,cat:document.getElementById('cat').value||'Outros',desc:document.getElementById('desc').value,fotos:fotosBase64.slice(0,4),criado:Date.now()});
    st.textContent='✅ Salvo!'; setTimeout(()=>{ showTab('empresas'); btn.disabled=false; btn.textContent='Salvar empresa'; },1200);
  }catch(e){ st.textContent='❌ '+e.message; btn.disabled=false; }
};
carregar();
</script>
</body>
</html>
