<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avalia Itapecuru</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F5F5F7]">
<nav class="bg-black text-white p-4 flex justify-between items-center sticky top-0">
<b class="text-xl" onclick="location.reload()">⭐ Avalia</b>
<div class="flex gap-2">
<button onclick="mostra('inicio')" class="bg-white/20 px-4 py-2 rounded-full text-sm">Empresas</button>
<button onclick="document.getElementById('modalSenha').classList.remove('hidden')" class="bg-blue-600 px-4 py-2 rounded-full text-sm">Cadastrar</button>
</div>
</nav>
<div id="tela-inicio" class="max-w-3xl mx-auto p-4">
<h1 class="font-black text-2xl mt-2">Empresas de Itapecuru</h1>
<div id="lista" class="mt-4 grid gap-3"></div>
</div>
<div id="modalSenha" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
<div class="bg-white p-6 rounded-3xl w-full max-w-sm">
<h2 class="font-bold text-lg">Senha Admin</h2>
<input id="senhaInput" type="password" placeholder="Digite 741852" class="border-2 p-3 rounded-xl w-full my-3">
<button onclick="checkSenha()" class="bg-black text-white w-full py-3 rounded-xl font-bold">Entrar</button>
<button onclick="document.getElementById('modalSenha').classList.add('hidden')" class="w-full mt-2 text-gray-500">Cancelar</button>
</div>
</div>
<div id="modalCad" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
<div class="bg-white p-6 rounded-3xl w-full max-w-sm">
<h2 class="font-bold text-lg">Nova Empresa</h2>
<input id="nomeEmpresa" placeholder="Nome da empresa" class="border-2 p-3 rounded-xl w-full mt-3">
<input id="catEmpresa" placeholder="Categoria ex: Restaurante" class="border-2 p-3 rounded-xl w-full mt-3">
<button onclick="salvarEmpresa()" class="bg-green-600 text-white w-full py-3 rounded-xl mt-4 font-bold">Salvar</button>
</div>
</div>
<script>
let empresas = JSON.parse(localStorage.getItem('avalia_v2')||'[]');
const $ = id => document.getElementById(id);
function mostra(t){ document.getElementById('tela-inicio').classList.remove('hidden'); render(); }
function checkSenha(){ if($('senhaInput').value==='741852'){ $('modalSenha').classList.add('hidden'); $('modalCad').classList.remove('hidden'); } else alert('Senha errada'); }
function salvarEmpresa(){
const nome=$('nomeEmpresa').value.trim(); const cat=$('catEmpresa').value.trim();
if(!nome) return alert('Digite nome');
empresas.push({id:Date.now(), nome, categoria:cat, avaliacoes:[]});
localStorage.setItem('avalia_v2', JSON.stringify(empresas));
$('nomeEmpresa').value=''; $('modalCad').classList.add('hidden'); render(); alert('Empresa salva! Agora vai aparecer pra todo mundo que acessar seu link? NÃO - ainda é só no seu celular. Para ficar online precisamos ativar o Firebase, me avisa que eu te ajudo.');
}
function avaliar(id){
const nota=prompt('Nota de 1 a 5:'); if(!nota) return;
const com=prompt('Comentário:')||'';
const emp=empresas.find(e=>e.id==id); emp.avaliacoes.push({nota, comentario:com});
localStorage.setItem('avalia_v2', JSON.stringify(empresas)); render();
}
function render(){
const lista=$('lista'); lista.innerHTML='';
if(empresas.length==0) lista.innerHTML='<p class="text-gray-500">Nenhuma empresa ainda. Cadastre a primeira!</p>';
empresas.forEach(e=>{
const media=e.avaliacoes.length? (e.avaliacoes.reduce((s,a)=>s+parseInt(a.nota),0)/e.avaliacoes.length).toFixed(1):'0';
const div=document.createElement('div'); div.className='bg-white p-4 rounded-2xl shadow';
div.innerHTML=`<h3 class="font-bold">${e.nome}</h3><p class="text-sm text-gray-500">${e.categoria} • ⭐ ${media} (${e.avaliacoes.length} avaliações)</p><button onclick="avaliar(${e.id})" class="mt-2 bg-yellow-400 px-4 py-2 rounded-full text-sm font-bold w-full">Avaliar ⭐</button><div class="mt-2 text-sm">${e.avaliacoes.map(a=>`⭐${a.nota} - ${a.comentario}`).join('<br>')}</div>`;
lista.appendChild(div);
});
}
render();
</script>
</body>
</html>
