<script>
function cadastrar(){
  let nome=$('c-nome').value.trim(),cnpj=$('c-cnpj').value.trim(),cat=$('c-cat').value,tel=$('c-tel').value.trim(),email=$('c-email').value.trim(),desc=$('c-desc').value.trim();
  if(!nome)return alert('Nome obrigatório');
  if(!validarCNPJ(cnpj))return alert('CNPJ inválido!');
  // BLOQUEIA CNPJ REPETIDO
  let cnpjLimpo = cnpj.replace(/\D/g,'');
  if(empresas.some(e=> e.cnpj.replace(/\D/g,'') === cnpjLimpo )){
    return alert('❌ Esse CNPJ já foi cadastrado!');
  }
  if(fotosTemp.length==0)return alert('Coloque 1 foto');
  let emp={id:Date.now().toString(),nome,cnpj,cat,tel,email,desc,fotos:fotosTemp,avs:[]};
  empresas.push(emp);save();
  $('c-nome').value='';$('c-cnpj').value='';$('c-tel').value='';$('c-email').value='';$('c-desc').value='';$('preview').innerHTML='';fotosTemp=[];$('cnpj-msg').classList.add('hidden');
  renderAdmin();renderInicio();
  // GERA QR NA HORA - CORRIGIDO
  abrirQR(emp);
}
function abrirQR(emp){
  $('qr-nome').innerText=emp.nome;
  let qrDiv=$('qrcode');qrDiv.innerHTML='';
  // AGORA LINK CURTO - SÓ ID - NUNCA FALHA
  let link=location.origin+location.pathname+'?id='+emp.id;
  new QRCode(qrDiv,{text:link,width:220,height:220,correctLevel:QRCode.CorrectLevel.H});
  $('modal-qr').classList.remove('hidden');
}
// NOVO: LER TANTO ?d= QUANTO ?id=
document.addEventListener('DOMContentLoaded',()=>{
  $('btn-emp').addEventListener('click',irInicio);
  $('btn-rank').addEventListener('click',irRank);
  $('btn-cad').addEventListener('click',abrirAdmin);
  $('btn-entrar').addEventListener('click',checkSenha);
  $('btn-cadastrar').addEventListener('click',cadastrar);
  $('btn-avaliar').addEventListener('click',avaliar);
  document.querySelectorAll('#stars span').forEach(s=>{s.addEventListener('click',()=>{estrela=parseInt(s.dataset.s);document.querySelectorAll('#stars span').forEach((el,i)=>{el.innerText=i<estrela?'★':'☆';el.className=i<estrela?'text-yellow-500':'text-gray-300';});});});
  let params = new URLSearchParams(location.search);
  let p = params.get('d');
  let id = params.get('id');
  if(p){try{let emp=JSON.parse(decodeURIComponent(atob(p)));mostrar(emp);return;}catch(e){}}
  if(id){let emp=empresas.find(x=>x.id==id); if(emp){mostrar(emp);return;}}
  renderInicio();
});
</script>
